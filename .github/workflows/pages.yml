name: Publish Hausleitner ERP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild static site
        run: |
          mkdir -p _site
          base64 -d app/index.html.gz.b64 | gunzip > _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          grep -q 'Hausleitner ERP' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild static site
        run: |
          mkdir -p _site
          base64 -d app/index.html.gz.b64 | gunzip > _site/index.html
          touch _site/.nojekyll
      - name: Cloudflare Pages deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_PROJECT_NAME != '' }}
        run: npx --yes wrangler@latest pages deploy _site --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=main
      - name: Cloudflare configuration missing
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_PROJECT_NAME == '' }}
        run: echo 'Cloudflare deploy skipped because repository secret/variable binding is not present.'
